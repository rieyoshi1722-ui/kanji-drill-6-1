<html lang="ja">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>6年上 漢字ドリル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* layout: one narrow column like a workbook page; every kanji sits in a 田字格 practice box */
:root{
  --paper:#FFE56B; --card:#FFFBE3; --ink:#2B2200; --muted:#6E5B12; --line:#EBCB4A;
  --accent:#FFC21A; --on-accent:#2B2200; --edge:#B87800; --hi:#FFD84A;
  --ok:#17794B; --okbg:#DDF2D0; --ng:#B3261E; --ngbg:#FFE0D6;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-kanji:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#2A2208; --card:#3A300F; --ink:#FFF3C2; --muted:#D2BF7C; --line:#6A5A1E;
    --accent:#FFC933; --on-accent:#2B2200; --edge:#FFD35A; --hi:#7A5F00;
    --ok:#7FE0A5; --okbg:#1E3A26; --ng:#FF9C8F; --ngbg:#4A2620; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#2A2208; --card:#3A300F; --ink:#FFF3C2; --muted:#D2BF7C; --line:#6A5A1E;
    --accent:#FFC933; --on-accent:#2B2200; --edge:#FFD35A; --hi:#7A5F00;
    --ok:#7FE0A5; --okbg:#1E3A26; --ng:#FF9C8F; --ngbg:#4A2620; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:1rem;line-height:1.6;padding-inline:16px;padding-block:18px 56px}
.wrap{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--edge);outline-offset:2px}
h1,h2,p,ul{margin:0}
ul{padding:0;list-style:none}

.tj{position:relative;display:inline-grid;place-items:center;flex:none;width:var(--s,3rem);height:var(--s,3rem);border:1.5px solid var(--edge);background:var(--card);font-family:var(--f-kanji);font-weight:500;font-size:calc(var(--s,3rem)*.76);line-height:1;color:var(--ink)}
.tj::before,.tj::after{content:"";position:absolute;pointer-events:none}
.tj::before{left:50%;top:0;bottom:0;border-left:1px dashed var(--line)}
.tj::after{top:50%;left:0;right:0;border-top:1px dashed var(--line)}
.tj>span{position:relative;z-index:1}
.tj.hot{background:var(--hi)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand h1{font-size:1.375rem;line-height:1.2}
.brand p{color:var(--muted);font-size:.8125rem}
.back{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:.875rem;white-space:nowrap}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9375rem}
.lab{font-size:.8125rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sec{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:.9375rem;font-weight:700}
.chip small{font-weight:500;font-size:.75rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--edge);color:var(--on-accent)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
.notice{background:var(--card);border:1.5px solid var(--edge);color:var(--ink);padding:10px 14px;border-radius:10px;font-size:.9375rem}

.modes{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.mode{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px}
.mode b{display:block;font-size:1.0625rem;line-height:1.3}
.mode small{display:block;color:var(--muted);font-size:.8125rem;line-height:1.4}
.mode .go{color:var(--edge);font-size:1.5rem;line-height:1}
.mode.test{background:var(--accent);color:var(--on-accent);border:2px solid var(--edge);border-radius:12px;padding:14px;margin-top:14px}
.mode.test small,.mode.test .go{color:inherit;opacity:.9}
.help{color:var(--muted);font-size:.875rem}
.chip[disabled]{opacity:.5;cursor:default}

.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.sent{font-family:var(--f-kanji);font-weight:500;font-size:1.5rem;line-height:2;text-wrap:pretty}
.sent.ctx{font-size:1.0625rem;line-height:2.6;color:var(--muted)}
.sent.ctx .mark{font-size:2.25rem;color:var(--ink);padding-inline:4px}
.sent.ctx .box{width:1.05em;height:1.05em;vertical-align:-.15em}
.sent.word{font-size:2.5rem;text-align:center;line-height:1.4;padding-block:6px}
.mark{background:linear-gradient(transparent 58%,var(--hi) 58%);font-weight:700;padding-inline:2px}
.box{display:inline-block;width:1.1em;height:1.1em;border:2px solid var(--edge);background:var(--card);vertical-align:-.2em;margin-inline:1px}
.hint{color:var(--muted);font-size:.9375rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr));gap:10px}
.opts.k{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:8px;min-height:3.25rem;min-width:0;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);text-align:left;font-size:1.125rem}
.opt .l{color:var(--muted);font-size:.8125rem;flex:none}
.opts.k .opt{flex-direction:column;justify-content:center;gap:0;padding:6px 0;text-align:center;font-family:var(--f-kanji);font-size:2.25rem;line-height:1.2}
.opts.k .opt .l{font-family:var(--f-ui)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--ng);background:var(--ngbg)}
.opt.correct::after,.opt.wrong::after{margin-left:auto;font-family:var(--f-ui);font-weight:700;font-size:1.125rem}
.opt.correct::after{content:"○";color:var(--ok)}
.opt.wrong::after{content:"×";color:var(--ng)}
.opts.k .opt::after{margin:0;font-size:1rem}
.fb{border:1.5px solid;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{border-color:var(--ok);background:var(--okbg)}
.fb.ng{border-color:var(--ng);background:var(--ngbg)}
.fb b{font-size:1.125rem}
.kinfo{font-size:.9375rem;color:var(--muted)}
.kinfo .k{font-family:var(--f-kanji);font-size:1.25rem;color:var(--ink)}
.btn{border:2px solid var(--edge);border-radius:10px;padding:12px 18px;background:var(--accent);color:var(--on-accent);font-weight:700;min-height:3rem}
.btn.sub{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row .btn{flex:1 1 9rem}
.chars{display:flex;flex-wrap:wrap;gap:6px}
.reveal{display:flex;flex-direction:column;gap:14px;border-top:1px dashed var(--line);padding-top:16px}

.result{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.score{font-size:3.25rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.score small{font-size:1.25rem;color:var(--muted);font-weight:500}
.split{color:var(--muted);font-size:.9375rem;font-variant-numeric:tabular-nums}
.wlist{display:flex;flex-direction:column}
.wlist li{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.wlist .sent{font-size:1.125rem;line-height:1.8}

.unit{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.unit h2{font-size:1.125rem}
.unit span{color:var(--muted);font-size:.8125rem}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:12px}
.kcard{display:flex;gap:14px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:0}
.kcard .info{display:flex;flex-direction:column;gap:6px;min-width:0}
.kcard .meta{font-size:.875rem;color:var(--muted)}
.kcard .meta b{color:var(--ink)}
.wl{display:flex;flex-wrap:wrap;gap:2px 14px;font-family:var(--f-kanji);font-size:1.0625rem;line-height:1.9}
.ex{font-family:var(--f-kanji);font-size:.9375rem;color:var(--muted);line-height:1.7}
.ex b{color:var(--ink);font-weight:700}
rt{font-family:var(--f-ui);font-size:.5em}

.hsticky{position:sticky;top:0;z-index:5;background:var(--paper);padding-block:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.hsticky .sent{font-size:1rem;line-height:1.8;margin:0;color:var(--muted)}
.hsticky .sent .mark{font-size:1.5rem;color:var(--ink)}
.hand{scroll-margin-top:6.5rem;--hs:min(95vw,640px,86vh);position:relative;left:50%;transform:translateX(-50%);width:var(--hs);display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:3rem;padding-top:12px;flex-wrap:wrap}
.hl{font-size:.9375rem;font-weight:700;min-width:0}
.hl .okt{color:var(--ok)}.hl .wnt{color:var(--ng)}
.hbtns{display:flex;gap:8px}
.hbtns .back{padding:8px 12px;min-height:2.5rem;font-size:.8125rem}
.hbox{position:relative;width:100%;aspect-ratio:1/1;background:var(--card);border:2px solid var(--edge);border-radius:6px}
.hbox::before,.hbox::after{content:"";position:absolute;pointer-events:none;z-index:0}
.hbox::before{left:50%;top:0;bottom:0;border-left:2px dashed var(--line)}
.hbox::after{top:50%;left:0;right:0;border-top:2px dashed var(--line)}
.hbox canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.hact{display:flex;flex-direction:column;gap:12px;padding-block:14px 6px}
.help.credit{font-size:.75rem}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

var MISS=ld('miss',{});

var Q=null;
var RECENT=ld('recent',{read:[],write:[],paper:[]});
function spread(a,lastK){
  var rest=a.slice(),out=[];
  while(rest.length){
    var j=0;
    for(var i=0;i<rest.length;i++){if(rest[i].k.c!==lastK){j=i;break}}
    var it=rest.splice(j,1)[0];out.push(it);lastK=it.k.c;
  }
  return out;
}
function lastKanji(kind){
  var rec=RECENT[kind]||[],id=rec[rec.length-1];
  for(var i=0;i<ITEMS.length;i++){if(ITEMS[i].id===id)return ITEMS[i].k.c}
  return '';
}
function pickRecent(kind,p,n){
  var rec=RECENT[kind]||[];
  var fresh=shuffle(p.filter(function(it){return rec.indexOf(it.id)<0}));
  var old=p.filter(function(it){return rec.indexOf(it.id)>=0}).sort(function(a,b){return rec.indexOf(a.id)-rec.indexOf(b.id)});
  var pick=spread(shuffle(fresh.concat(old).slice(0,n)),lastKanji(kind));
  var ids=pick.map(function(it){return it.id});
  RECENT[kind]=rec.filter(function(id){return ids.indexOf(id)<0}).concat(ids).slice(-40);
  sv('recent',RECENT);
  return pick;
}
var SEEN=ld('seen',{read:[],write:[],rc:0,wc:0});
function markSeen(kind,id){
  var a=SEEN[kind];
  if(a.indexOf(id)<0)a.push(id);
  if(a.length>=ITEMS.length){SEEN[kind]=[];SEEN[kind==='read'?'rc':'wc']++}
  sv('seen',SEEN);
}
function takeTest(kind,n,exclude){
  var seen=SEEN[kind];
  var ok=function(it){return exclude.indexOf(it.id)<0};
  var fresh=shuffle(ITEMS.filter(function(it){return ok(it)&&seen.indexOf(it.id)<0})).slice(0,n);
  if(fresh.length<n){
    var ids=fresh.map(function(it){return it.id});
    var more=shuffle(ITEMS.filter(function(it){return ok(it)&&ids.indexOf(it.id)<0})).slice(0,n-fresh.length);
    fresh=fresh.concat(more);
  }
  return fresh;
}

function track(kind,it,ok){
  var key=kind+':'+it.id;
  if(ok)delete MISS[key];else MISS[key]=1;
  sv('miss',MISS);
}
function pool(kind){
  return ITEMS.filter(function(it){return S.units.indexOf(it.k.u)>=0&&(!S.missOnly||MISS[kind+':'+it.id])});
}

/* ---------- 手書きの判定（目安） ---------- */
function resamp(pts,n){
  if(pts.length===1)pts=[pts[0],pts[0]];
  var L=[0],i;
  for(i=1;i<pts.length;i++)L[i]=L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  var tot=L[L.length-1],out=[];
  if(tot===0){for(i=0;i<n;i++)out.push(pts[0]);return out}
  var j=0;
  for(var k=0;k<n;k++){
    var t=tot*k/(n-1);
    while(j<L.length-2&&L[j+1]<t)j++;
    var seg=L[j+1]-L[j],u=seg?(t-L[j])/seg:0;
    out.push([pts[j][0]+(pts[j+1][0]-pts[j][0])*u,pts[j][1]+(pts[j+1][1]-pts[j][1])*u]);
  }
  return out;
}
function normStrokes(strokes){
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  strokes.forEach(function(s){s.forEach(function(p){if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1]})});
  var sc=Math.max(x1-x0,y1-y0)||1,cx=(x0+x1)/2,cy=(y0+y1)/2;
  return strokes.map(function(s){return resamp(s,24).map(function(p){return[(p[0]-cx)/sc,(p[1]-cy)/sc]})});
}
function sdist(a,b){var t=0;for(var i=0;i<a.length;i++)t+=Math.hypot(a[i][0]-b[i][0],a[i][1]-b[i][1]);return t/a.length}
var THR=0.2;
function backwards(u,r){
  var rx=r[r.length-1][0]-r[0][0],ry=r[r.length-1][1]-r[0][1];
  if(Math.hypot(rx,ry)<0.18)return false;
  var ux=u[u.length-1][0]-u[0][0],uy=u[u.length-1][1]-u[0][1];
  return rx*ux+ry*uy<0;
}
function judgeChar(ref,user){
  var nR=ref.length,nU=user.length;
  if(!nU)return{kind:'ng',text:'まだ書いていません'};
  if(nU!==nR)return{kind:'ng',text:'線の数がちがうかも（書いた '+nU+'本／正しい '+nR+'本）'};
  var R=normStrokes(ref),U=normStrokes(user),bad=[],rev=[],i,j;
  for(i=0;i<nR;i++){
    if(sdist(U[i],R[i])>=THR)bad.push(i);
    else if(backwards(U[i],R[i]))rev.push(i);
  }
  if(!bad.length&&rev.length)return{kind:'warn',text:'画数も形も合っています。'+rev.map(function(k){return(k+1)+'本目'}).join('、')+'の書く向きが ぎゃくかも'};
  if(!bad.length)return{kind:'ok',text:'合っているようです'};
  if(bad.length===2){
    var a=bad[0],b=bad[1];
    if(sdist(U[a],R[b])<THR&&sdist(U[b],R[a])<THR)return{kind:'warn',text:'形は合っています。書き順が ちがうかも（'+(a+1)+'本目と'+(b+1)+'本目）'};
  }
  var swapped=bad.filter(function(k){for(j=0;j<nR;j++)if(j!==k&&sdist(U[k],R[j])<THR)return true;return false});
  if(swapped.length===bad.length&&bad.length<=3)return{kind:'warn',text:'画数は合っています。書き順が ちがうかも（'+bad.map(function(k){return(k+1)+'本目'}).join('、')+'）'};
  if(bad.length<=2)return{kind:'warn',text:'画数は合っています。'+bad.map(function(k){return(k+1)+'本目'}).join('と')+'の形が ちがうかも'};
  return{kind:'ng',text:'画数は合っていますが、形が ちがうようです（'+bad.length+'本が ちがうかも）'};
}

/* ---------- question builders ---------- */
function readOpts(it){
  var set=[it.y],v=variant(it.r),cand=[];
  if(v)cand.push(v);
  var near=shuffle(ALLR.filter(function(x){return x!==it.r&&Math.abs(x.length-it.r.length)<=1}));
  cand=cand.concat(near);
  for(var i=0;i<cand.length&&set.length<4;i++){
    var s=it.pre+cand[i]+it.post;
    if(set.indexOf(s)<0)set.push(s);
  }
  return shuffle(set);
}
function writeOpts(it){
  var c=it.k.c,set=[c];
  shuffle(it.k.look).forEach(function(x){if(set.length<3)set.push(x)});
  var others=shuffle(K.map(function(k){return k.c}).filter(function(x){return set.indexOf(x)<0}));
  while(set.length<4)set.push(others.pop());
  return shuffle(set);
}
function mkRead(it){var o=readOpts(it);return{mode:'read',it:it,opts:o,ans:o.indexOf(it.y)}}
function mkWrite(it){var o=writeOpts(it);return{mode:'write',it:it,opts:o,ans:o.indexOf(it.k.c)}}
function mkPaper(it){return{mode:'paper',it:it}}
function mkHand(it){return{mode:'hand',it:it}}
/* ---------- 手書きモード ---------- */
function hchars(it){return Array.from(it.w).filter(function(c){return SD[c]})}
function hstate(q){
  if(!Q.hand)Q.hand={boxes:hchars(q.it).map(function(){return[]}),done:false,res:null,msg:''};
  return Q.hand;
}
function handHTML(q,head){
  var H=hstate(q),cs=hchars(q.it),n=cs.length;
  var rows=cs.map(function(c,i){
    var lab=(n>1?(i+1)+'字め':'書く字');
    var left,btns='';
    if(H.done){
      var r=H.res[i];
      left='<span class="hl">'+lab+'　<span class="'+(r.kind==='ok'?'okt':'wnt')+'">'+(r.kind==='ok'?'✓ ':'△ ')+r.text+'</span></span>';
    }else{
      left='<span class="hl">'+lab+'</span>';
      btns='<span class="hbtns"><button class="back" data-a="hundo" data-i="'+i+'">1本もどす</button><button class="back" data-a="hclear" data-i="'+i+'">ぜんぶ消す</button></span>';
    }
    return '<div class="hrow">'+left+btns+'</div><div class="hbox"><canvas data-i="'+i+'" aria-label="'+lab+'を書くマス"></canvas></div>';
  }).join('');
  var act;
  if(!H.done){
    act='<p class="help">マスの上は 書くところです。スクロールするときは、マスの外（「'+(n>1?'1字め':'書く字')+'」と書いてある行など）を 指でなぞります。</p>'
      +(H.msg?'<p class="notice" role="status">'+H.msg+'</p>':'')
      +'<button class="btn" data-a="hdone">決定</button>';
  }else{
    var allok=H.res.every(function(r){return r.kind==='ok'});
    act='<div class="fb '+(allok?'ok':'ng')+'" role="status"><b>アプリの目安：'+(allok?'○ 合っているようです':'△ 見なおしてみよう')+'</b>'
      +'<p class="hint">うすい字が お手本です（数字は 書く順番）。目安なので、○×は 自分で決めます。</p>'
      +sent(q.it,'ans')+kinfo(q.it.k)
      +'<div class="row"><button class="btn" data-a="self" data-r="ok">書けた ○</button><button class="btn sub" data-a="self" data-r="ng">もう一回 ×</button></div></div>';
  }
  return head+'<div class="hsticky"><p class="lab">ひらがなの ところを、マスに書こう</p>'+sent(q.it,'hand')+'</div><div class="hand">'+rows+'<div class="hact">'+act+'</div></div>';
}
function hcol(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()||'#000'}
function hsize(cv){
  var r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,3);
  if(cv._w&&Math.abs(cv._w-r.width)<1)return false;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);cv._w=r.width;cv._dpr=dpr;
  return true;
}
function hdraw(cv){
  var q=Q.qs[Q.i],H=Q.hand,i=+cv.dataset.i,ctx=cv.getContext('2d'),W=cv.width;
  ctx.clearRect(0,0,W,W);
  ctx.lineCap='round';ctx.lineJoin='round';
  if(H.done){
    var ref=SD[hchars(q.it)[i]];
    ctx.save();ctx.globalAlpha=.38;ctx.strokeStyle=hcol('--edge');ctx.lineWidth=W*.05;
    ref.forEach(function(s){
      ctx.beginPath();
      s.forEach(function(p,k){var x=p[0]/1024*W,y=p[1]/1024*W;if(k)ctx.lineTo(x,y);else ctx.moveTo(x,y)});
      ctx.stroke();
    });
    ctx.restore();
    ctx.fillStyle=hcol('--muted');ctx.font='700 '+Math.round(W*.04)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ref.forEach(function(s,k){
      var a=s[0],b=s[Math.min(2,s.length-1)],dx=a[0]-b[0],dy=a[1]-b[1],l=Math.hypot(dx,dy)||1;
      ctx.fillText(String(k+1),(a[0]+dx/l*38)/1024*W,(a[1]+dy/l*38)/1024*W);
    });
  }
  ctx.strokeStyle=hcol('--ink');ctx.lineWidth=W*.04;
  H.boxes[i].forEach(function(s){
    ctx.beginPath();
    s.forEach(function(p,k){var x=p[0]*W,y=p[1]*W;if(k)ctx.lineTo(x,y);else ctx.moveTo(x,y)});
    if(s.length===1)ctx.lineTo(s[0][0]*W+.1,s[0][1]*W);
    ctx.stroke();
  });
}
function hattach(cv){
  var i=+cv.dataset.i;
  function pt(e){var r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
  function seg(a,b){
    var ctx=cv.getContext('2d'),W=cv.width;
    ctx.strokeStyle=hcol('--ink');ctx.lineWidth=W*.04;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(a[0]*W,a[1]*W);ctx.lineTo(b[0]*W+(a===b?.1:0),b[1]*W);ctx.stroke();
  }
  cv.addEventListener('touchstart',function(e){e.preventDefault()},{passive:false});
  cv.addEventListener('pointerdown',function(e){
    if(Q.hand.done)return;
    e.preventDefault();
    try{cv.setPointerCapture(e.pointerId)}catch(x){}
    var p=pt(e);cv._cur=[p];Q.hand.boxes[i].push(cv._cur);seg(p,p);
  });
  cv.addEventListener('pointermove',function(e){
    if(!cv._cur)return;
    e.preventDefault();
    var evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[e];
    if(!evs.length)evs=[e];
    evs.forEach(function(ev){
      var p=pt(ev),l=cv._cur[cv._cur.length-1];
      if(Math.hypot(p[0]-l[0],p[1]-l[1])<.004)return;
      cv._cur.push(p);seg(l,p);
    });
  });
  function end(){cv._cur=null}
  cv.addEventListener('pointerup',end);
  cv.addEventListener('pointercancel',end);
}
function initHand(){
  var q=Q&&Q.qs&&Q.qs[Q.i];
  if(S.view!=='quiz'||!q||q.mode!=='hand'||!Q.hand)return;
  app.querySelectorAll('canvas[data-i]').forEach(function(cv){
    hsize(cv);hdraw(cv);
    if(!Q.hand.done&&!cv._bound){cv._bound=true;hattach(cv)}
  });
}
window.addEventListener('resize',function(){
  var q=Q&&Q.qs&&Q.qs[Q.i];
  if(S.view!=='quiz'||!q||q.mode!=='hand'||!Q.hand)return;
  app.querySelectorAll('canvas[data-i]').forEach(function(cv){if(hsize(cv))hdraw(cv)});
});
function hdone(){
  var q=Q.qs[Q.i],H=Q.hand,cs=hchars(q.it),empty=[];
  H.boxes.forEach(function(b,i){if(!b.length)empty.push(i+1)});
  if(empty.length){H.msg=empty.join('・')+'字めが まだ書けていません。';render();return}
  H.msg='';
  H.res=cs.map(function(c,i){return judgeChar(SD[c],H.boxes[i])});
  H.done=true;render();
  var h=app.querySelector('.hand');if(h&&h.scrollIntoView){try{h.scrollIntoView({block:'start',behavior:'smooth'})}catch(x){}}
}

function mkSame(h){var o=shuffle(h[3]);return{mode:'same',h:h,opts:o,ans:o.indexOf(h[1])}}

/* ---------- html pieces ---------- */
function sent(it,mode){
  var t=it.t,w=it.w,i=t.indexOf(w),pre=t.slice(0,i),post=t.slice(i+w.length),mid;
  if(mode==='write')mid='<span class="mark">'+w.replace(it.k.c,'<i class="box"></i>')+'</span>';
  else if(mode==='paper'||mode==='hand')mid='<span class="mark">'+it.y+'</span>';
  else mid='<span class="mark">'+w+'</span>';
  var inner=pre+mid+post;
  var ctx=(mode==='write'||mode==='paper'||mode==='ans'||mode==='hand')?' ctx':'';
  return '<p class="sent'+(t===w?' word':'')+ctx+'">'+inner+'</p>';
}
function kinfo(k){
  return '<p class="kinfo"><span class="k">'+k.c+'</span>　'+k.n+'画'+(k.on?'　音 '+k.on:'')+(k.kun?'　訓 '+k.kun:'')+'</p>';
}
function qLabel(q){
  if(q.mode==='read')return '線の ことばの 読み方を えらぼう';
  if(q.mode==='write')return '□に入る 漢字を えらぼう';
  if(q.mode==='paper')return 'ひらがなの ところを、漢字で 紙に書こう';
  if(q.mode==='hand')return 'ひらがなの ところを、マスに書こう';
  return '同じ読み方の 漢字。□に入るのは？';
}

/* ---------- views ---------- */
function homeHTML(){
  var units=[10,11,12],missN=Object.keys(MISS).length;
  function cnt(u){return K.filter(function(k){return k.u===u}).length}
  var chips=units.map(function(u){return '<button class="chip" data-a="unit" data-u="'+u+'" aria-pressed="'+(S.units.indexOf(u)>=0)+'">'+u+'<small>'+cnt(u)+'字</small></button>'}).join('');
  var ns=[10,20].map(function(n){return '<button class="chip" data-a="n" data-n="'+n+'" aria-pressed="'+(S.n===n)+'">'+n+'問</button>'}).join('');
  function mode(m,ic,title,desc,cls){
    return '<button class="mode '+(cls||'')+'" data-a="start" data-m="'+m+'">'+tj(ic,'2.5rem')+'<span><b>'+title+'</b><small>'+desc+'</small></span><span class="go" aria-hidden="true">›</span></button>';
  }
  return '<header class="top"><div class="brand">'+tj('漢','2.75rem','hot')+'<div><h1>漢字ドリル</h1><p>6年上　10〜12</p></div></div><button class="back" data-a="list">漢字いちらん</button></header>'
  +(S.notice?'<p class="notice" role="status">'+S.notice+'</p>':'')
  +'<section class="sec"><h2 class="lab">本</h2><div class="chips"><button class="chip" aria-pressed="true">上<small>'+K.length+'字</small></button><button class="chip" disabled>下<small>じゅんび中</small></button></div></section>'
  +'<section class="sec"><h2 class="lab">問題の数・ふくしゅう</h2><div class="chips">'+ns
  +'<button class="chip" data-a="miss" aria-pressed="'+S.missOnly+'">まちがえた問題だけ<small>'+missN+'</small></button></div></section>'
  +'<section class="sec"><h2 class="lab">れんしゅう</h2><div class="modes">'
  +mode('read','読','読み（4つから えらぶ）','文や ことばの 読み方')
  +mode('write','書','書き（4つから えらぶ）','□に入る 漢字。にた形の漢字も出ます')
  +mode('paper','練','書き取り（紙に書く）','ひらがなを見て 紙に書き、答えを見て ○×')
  +mode('hand','手','デジタル書き（スマホに書く）','マスに指で書くと、お手本と重ねて見られます')
  +mode('same','同','同じ読み方の漢字','12の あかねプラス（12問）')
  +mode('test','試','50問テスト','読み25問 ＋ 書き25問。何回かやると、全部の問題が出ます','test')
  +'</div></section>'
  +'<section class="sec"><p class="help">50問テストで出た問題：読み '+SEEN.read.length+' / '+ITEMS.length+'　書き '+SEEN.write.length+' / '+ITEMS.length+(SEEN.rc||SEEN.wc?'（ぜんぶ出きった回数 読み'+SEEN.rc+'・書き'+SEEN.wc+'）':'')+'</p>'
  +'<div class="chips"><button class="back" data-a="resetSeen">'+(S.confirmReset?'もう一度おすと リセット':'出た問題の きろくを リセット')+'</button></div></section>'
  +'<p class="help">「書き取り（紙）」は、紙に書いてから 自分で○×をつけます。「デジタル書き」は、画面に書くと お手本と重ねて見られます（目安なので ○×は 自分で決めます）。まちがえた問題は 記録されます。</p>'
  +'<p class="help credit">手書きモードの お手本データは、animCJK と Make Me a Hanzi（LGPL）が元になっています。</p>';
}
function progress(){
  return '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="'+Q.qs.length+'" aria-valuenow="'+Q.i+'"><i style="width:'+(Q.i/Q.qs.length*100)+'%"></i></div>';
}
function quizHTML(){
  var q=Q.qs[Q.i],N=Q.qs.length,last=Q.i===N-1;
  var head='<header class="top"><button class="back" data-a="quit">やめる</button><span class="count">'+(Q.i+1)+' / '+N+'</span></header>'+progress();
  var lab=qLabel(q);
  if(Q.kind==='test')lab=(Q.i<Q.split?'【読み】 ':'【書き】 ')+lab;
  var body='';
  if(q.mode==='hand')return handHTML(q,head);
  if(q.mode==='paper'){
    body='<p class="lab">'+lab+'</p>'+sent(q.it,'paper');
    if(!Q.revealed){
      body+='<button class="btn" data-a="reveal">答えを見る</button>';
    }else{
      var chars=Array.from(q.it.w).map(function(ch){return tj(ch,'3.25rem',ch===q.it.k.c?'hot':'')}).join('');
      body+='<div class="reveal"><div class="chars">'+chars+'</div>'+sent(q.it,'ans')+kinfo(q.it.k)
        +'<div class="row"><button class="btn" data-a="self" data-r="ok">書けた ○</button><button class="btn sub" data-a="self" data-r="ng">もう一回 ×</button></div></div>';
    }
  }else{
    var main,isK=q.mode!=='read';
    if(q.mode==='same')main='<p class="sent">'+q.h[0].replace('□','<i class="box"></i>')+'</p><p class="hint">□の読み方：'+q.h[2]+'</p>';
    else if(q.mode==='write')main=sent(q.it,'write')+'<p class="hint">読み方：'+q.it.y+'</p>';
    else main=sent(q.it,'read');
    var done=Q.picked!==null;
    var opts=q.opts.map(function(o,i){
      var cls='opt';
      if(done){if(i===q.ans)cls+=' correct';else if(i===Q.picked)cls+=' wrong'}
      return '<button class="'+cls+'" data-a="pick" data-i="'+i+'"'+(done?' disabled':'')+'><span class="l">'+LAB[i]+'</span><span>'+o+'</span></button>';
    }).join('');
    body='<p class="lab">'+lab+'</p>'+main+'<div class="opts'+(isK?' k':'')+'">'+opts+'</div>';
    if(done){
      var ok=Q.picked===q.ans,ansText,info='';
      if(q.mode==='same')ansText=q.h[1];
      else if(q.mode==='read'){ansText=q.it.w+' ＝ '+q.it.y;info=kinfo(q.it.k)}
      else{ansText=q.it.k.c+'（'+q.it.w+'）';info=kinfo(q.it.k)}
      body+='<div class="fb '+(ok?'ok':'ng')+'" role="status"><b>'+(ok?'○ せいかい！':'× ざんねん')+'</b><p>答え：'+ansText+'</p>'+info
        +'<button class="btn" data-a="next">'+(last?'けっかを見る':'つぎへ')+'</button></div>';
    }
  }
  return head+'<section class="q">'+body+'</section>';
}
function resultHTML(){
  var N=Q.qs.length,s=Q.score,pct=s/N;
  var msg=pct>=0.9?'かんぺき！ この調子です。':pct>=0.7?'いい調子。まちがえたところを見なおそう。':'もう一回やってみよう。まちがえた問題だけ やりなおせます。';
  var split='';
  if(Q.kind==='test'){
    var rN=Q.split,wN=N-Q.split;
    var rW=Q.wrong.filter(function(q){return q.mode==='read'}).length,wW=Q.wrong.length-rW;
    split='<p class="split">読み '+(rN-rW)+' / '+rN+'　書き '+(wN-wW)+' / '+wN+'</p>';
  }
  var list=Q.wrong.map(function(q){
    if(q.mode==='same')return '<li><p class="sent">'+q.h[0].replace('□','<span class="mark">'+q.h[1]+'</span>')+'</p><p class="hint">読み方：'+q.h[2]+'</p></li>';
    return '<li>'+sent(q.it,'read')+'<p class="hint">読み方：'+q.it.y+'　'+q.it.k.c+'は '+q.it.k.n+'画</p></li>';
  }).join('');
  return '<header class="top"><button class="back" data-a="home">ホーム</button></header>'
  +'<section class="q result"><p class="lab">けっか</p><p class="score">'+s+'<small> / '+N+'</small></p>'+split+'<p>'+msg+'</p>'
  +'<div class="row" style="width:100%">'+(Q.wrong.length?'<button class="btn" data-a="retryWrong">まちがいだけ やりなおす</button>':'')
  +'<button class="btn sub" data-a="retry">もう一度</button></div></section>'
  +(Q.wrong.length?'<section class="sec"><h2 class="lab">まちがえた問題</h2><ul class="wlist">'+list+'</ul></section>':'');
}
function listHTML(){
  var out='<header class="top"><button class="back" data-a="home">もどる</button><span class="count">漢字いちらん</span></header>';
  [10,11,12].forEach(function(u){
    var ks=K.filter(function(k){return k.u===u});
    out+='<div class="unit"><h2>'+u+'</h2><span>'+ks.length+'字</span></div><div class="kgrid">'+ks.map(function(k){
      var words=k.w.map(function(a){return '<li><ruby>'+a[0]+'<rt>'+a[1].replace(/[\[\]]/g,'')+'</rt></ruby></li>'}).join('');
      var ex=k.s.map(function(a){return '<p class="ex">'+a[0].replace(a[1],'<b>'+a[1]+'</b>')+'</p>'}).join('');
      return '<article class="kcard">'+tj(k.c,'4.5rem')+'<div class="info"><p class="meta"><b>'+k.n+'画</b>'+(k.on?'　音 '+k.on:'')+(k.kun?'　訓 '+k.kun:'')+'</p><ul class="wl">'+words+'</ul>'+ex+'</div></article>';
    }).join('')+'</div>';
  });
  return out;
}
function render(scroll){
  var v=S.view;
  app.innerHTML=v==='home'?homeHTML():v==='quiz'?quizHTML():v==='result'?resultHTML():listHTML();
  initHand();
  if(scroll){try{window.scrollTo(0,0)}catch(e){}}
  else{var fb=app.querySelector('.fb,.reveal');if(fb&&fb.scrollIntoView){try{fb.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}}
}

/* ---------- flow ---------- */
function begin(kind,qs,split,base){
  if(!qs.length){S.notice='その はんいには まちがえた問題が ありません。';S.view='home';render(true);return}
  Q={hand:null,kind:kind,base:base||kind,qs:qs,i:0,score:0,wrong:[],picked:null,revealed:false,split:split||0};
  S.view='quiz';S.notice='';render(true);
}
function start(m){
  S.notice='';
  if(m==='same')return begin('same',shuffle(H).map(mkSame));
  if(m==='test'){
    var rd=spread(takeTest('read',25,[]),'');
    var wr=spread(takeTest('write',25,rd.map(function(it){return it.id})),rd.length?rd[rd.length-1].k.c:'');
    return begin('test',rd.map(mkRead).concat(wr.map(mkWrite)),rd.length);
  }
  var items=pickRecent(m,pool(m),S.n);
  var mk=m==='read'?mkRead:m==='write'?mkWrite:m==='hand'?mkHand:mkPaper;
  begin(m,items.map(mk));
}
function advance(){
  Q.i++;Q.picked=null;Q.revealed=false;Q.hand=null;
  if(Q.i>=Q.qs.length)S.view='result';
  render(true);
}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,d=b.dataset;
  if(a==='unit'){
    var u=+d.u,i=S.units.indexOf(u);
    if(i>=0){if(S.units.length>1)S.units.splice(i,1)}else S.units.push(u);
    sv('units',S.units);S.notice='';render();
  }else if(a==='n'){S.n=+d.n;sv('n',S.n);render()}
  else if(a==='miss'){S.missOnly=!S.missOnly;render()}
  else if(a==='start')start(d.m);
  else if(a==='list'){S.view='list';render(true)}
  else if(a==='home'||a==='quit'){S.view='home';S.notice='';render(true)}
  else if(a==='pick'){
    if(Q.picked!==null)return;
    var q=Q.qs[Q.i],k=+d.i;Q.picked=k;
    var ok=k===q.ans;
    if(ok)Q.score++;else Q.wrong.push(q);
    if(q.mode!=='same')track(q.mode,q.it,ok);
    if(Q.kind==='test')markSeen(q.mode,q.it.id);
    render();
  }
  else if(a==='resetSeen'){
    if(!S.confirmReset){S.confirmReset=true}
    else{SEEN={read:[],write:[],rc:0,wc:0};sv('seen',SEEN);S.confirmReset=false}
    render();
  }
  else if(a==='hdone')hdone();
  else if(a==='hundo'||a==='hclear'){
    var bi=+d.i,bx=Q.hand.boxes[bi];
    if(a==='hundo')bx.pop();else bx.length=0;
    var cvv=app.querySelector('canvas[data-i="'+bi+'"]');if(cvv)hdraw(cvv);
  }
  else if(a==='next')advance();
  else if(a==='reveal'){Q.revealed=true;render()}
  else if(a==='self'){
    var q2=Q.qs[Q.i],ok2=d.r==='ok';
    if(ok2)Q.score++;else Q.wrong.push(q2);
    track(q2.mode==='hand'?'hand':'paper',q2.it,ok2);advance();
  }
  else if(a==='retry'){
    start(Q.base);
  }
  else if(a==='retryWrong'){
    var w=Q.wrong.slice();
    begin('wrong',w.map(function(q){var c={};for(var x in q)c[x]=q[x];return c}),0,Q.base);
  }
});
render(true);
})();
</script>
